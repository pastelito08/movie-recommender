{% extends "base.html" %}

{% block content %}
  <div class="card" style="max-width: 400px; margin: auto;">
    <h2>Log in</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="primary" type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
{% endblock %}
