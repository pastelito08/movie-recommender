<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Movie Recommender{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    nav { background: #1f2937; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font: inherit; cursor: pointer; }
    nav .spacer { flex: 1; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card a { color: #111827; text-decoration: none; font-weight: 600; }
    .tag { display: inline-block; background: #e5e7eb; border-radius: 12px; padding: 2px 10px; font-size: 12px; margin: 2px 2px 0 0; }
    .muted { color: #6b7280; font-size: 14px; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; background: #dbeafe; }
    .msg.error { background: #fee2e2; }
    .msg.success { background: #dcfce7; }
    .pager { margin-top: 24px; display: flex; gap: 16px; align-items: center; }
    form.inline { display: inline; }
    input, select, button.primary { padding: 8px 12px; font: inherit; }
    button.primary { background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'movie_list' %}"><strong>MovieRec</strong></a>
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <a href="{% url 'recommendations' %}">For you</a>
      <span>Hi, {{ user.username }}</span>
      <form class="inline" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'signup' %}">Sign up</a>
    {% endif %}
  </nav>

  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
